<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanAlert - Ocorrências Urbanas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ---- SIDEBAR / LAYOUT ---- */
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-logo { padding: 1.5rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .sidebar-logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .sidebar-logo h2 { font-size: 17px; font-weight: 700; }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-nav { padding: 1rem 0; flex: 1; overflow-y: auto; }
    .nav-section { padding: 0 1rem 0.5rem; font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.5rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1rem; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-muted); transition: all 0.2s; margin: 1px 8px; border-radius: 8px; position: relative; }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .nav-item.active { background: rgba(233,69,96,0.15); color: var(--accent); }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; }
    .notif-dot { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--accent); color: white; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
    .sidebar-user { padding: 1rem; border-top: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 8px; }
    .user-info:hover .user-name { color: var(--info); }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--info); flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 600; }
    .user-role { font-size: 11px; color: var(--text-muted); }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .topbar h2 { font-size: 18px; font-weight: 700; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .content { flex: 1; padding: 1.5rem; overflow-y: auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; }
    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .stat-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .stat-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    /* ---- AUTH ---- */
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%); padding: 2rem; }
    .auth-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; }
    .auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
    .auth-logo-icon { width: 44px; height: 44px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .auth-logo h1 { font-size: 22px; font-weight: 700; }
    .auth-logo span { color: var(--accent); }
    .auth-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.3); border-radius: var(--radius); padding: 4px; margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; padding: 8px; text-align: center; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: var(--text-muted); border: none; background: transparent; }
    .auth-tab.active { background: var(--accent); color: white; }
    /* ---- PERFIL ---- */
    .profile-avatar-big { width: 80px; height: 80px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; color: var(--info); margin: 0 auto 1rem; border: 3px solid var(--accent); }
    .profile-section { background: rgba(255,255,255,0.03); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; border: 1px solid var(--border); }
    .profile-section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>

<div id="root"></div>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
